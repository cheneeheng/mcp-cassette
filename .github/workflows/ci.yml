name: CI

on:
  push:
    branches: [main]
  pull_request:

# No pipeline may silently record against a live server (project invariant).
env:
  MCP_CASSETTE_MODE: none

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # No sync needed: the check reads files with stdlib only (tomllib + re).
      - run: uv run --no-project python scripts/check_version.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # Nothing else collects examples/ (testpaths is tests/), so its committed
      # cassettes would rot unnoticed. They are the surface people evaluate the
      # project on.
      - run: uv run pytest examples/ -q
      # The two-step gate walked through in HT-09, asserted by exit code so the
      # documented numbers cannot drift away from what the tool does.
      - name: Cassette gate
        run: |
          expect() {
            want=$1; shift
            "$@" && got=0 || got=$?
            if [ "$got" != "$want" ]; then
              echo "::error::expected exit $want, got $got: $*"
              exit 1
            fi
          }
          expect 0 uv run mcp-cassette lint examples/cassettes/tools.mcp.json
          expect 4 uv run mcp-cassette lint examples/cassettes/tools-v2.mcp.json
          expect 5 uv run mcp-cassette diff \
            examples/cassettes/tools.mcp.json \
            examples/cassettes/tools-v2.mcp.json --tools-only

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      # Subprocess-patched coverage (see [tool.coverage.run] in pyproject.toml):
      # record/replay engines run as subprocesses, so plain pytest-under-coverage
      # would miss most of the codebase. combine merges the per-process data files;
      # report enforces the fail_under gate.
      - run: uv run coverage run -m pytest -q
      - run: uv run coverage combine
      - run: uv run coverage report
