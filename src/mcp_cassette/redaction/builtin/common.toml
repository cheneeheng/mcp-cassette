# The bundled PII pack, enabled by default beside the structural rules and suppressed
# with --no-default-redactions. Every rule is direction "both" with the default "hash"
# strategy: distinct values stay distinguishable in the requests the matcher compares,
# and replay re-applies the same scrubbing to live requests.
#
# Heuristic, like lint: a regex that misses a format is a gap, not a guarantee. Card and
# IBAN matches must also pass their checksum, so a number that merely has the shape is
# left alone.
version = 1
id = "common"

[[rules]]
id = "email"
label = "EMAIL"
regex = '(?<![\w.%+-])[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}\b'

[[rules]]
id = "phone-e164"
label = "PHONE"
regex = '(?<![\w+])\+[1-9]\d{7,14}\b'

[[rules]]
id = "ipv4"
label = "IPV4"
regex = '(?<![\d.])(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}(?![\d.])'

[[rules]]
id = "ipv6"
label = "IPV6"
regex = '(?<![\w:])(?:(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}|(?:[0-9A-Fa-f]{1,4}:){1,6}:(?:[0-9A-Fa-f]{1,4}:){0,5}[0-9A-Fa-f]{1,4})(?![\w:])'

[[rules]]
id = "us-ssn"
label = "SSN"
regex = '(?<![\d-])(?!000|666|9\d\d)\d{3}-(?!00)\d{2}-(?!0000)\d{4}(?![\d-])'

[[rules]]
id = "iban"
label = "IBAN"
regex = '\b[A-Z]{2}\d{2}(?: ?[A-Z0-9]{4}){2,7}(?: ?[A-Z0-9]{1,3})?\b'
validator = "mod97"

[[rules]]
id = "payment-card"
label = "CARD"
regex = '(?<![\d-])\d(?:[ -]?\d){12,18}(?![\d-])'
validator = "luhn"

[[rules]]
id = "aws-access-key-id"
label = "AWS_KEY"
regex = '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'

[[rules]]
id = "pem-private-key"
label = "PRIVATE_KEY"
regex = '-----BEGIN (?:[A-Z0-9]+ )*PRIVATE KEY-----'

[[rules]]
id = "jwt"
label = "JWT"
regex = '\beyJ[A-Za-z0-9_-]{5,}\.eyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]+'
